<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, Menlo, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">APB_UART_TOP — Block Diagram</text>

  <!-- Testbench driver box -->
  <rect x="20" y="240" width="130" height="120" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <text x="85" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#4338ca">Testbench</text>
  <text x="85" y="308" text-anchor="middle" font-size="13" font-weight="bold" fill="#4338ca">driver.sv</text>
  <text x="85" y="330" text-anchor="middle" font-size="11" fill="#333">transfer, write,</text>
  <text x="85" y="345" text-anchor="middle" font-size="11" fill="#333">addr, wdata</text>

  <!-- Top-level box -->
  <rect x="185" y="70" width="780" height="500" rx="10" fill="none" stroke="#111" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="205" y="95" font-size="14" font-weight="bold" fill="#111">APB_UART_TOP</text>

  <!-- APB_MASTER -->
  <rect x="220" y="230" width="170" height="140" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="305" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">APB_MASTER</text>
  <text x="305" y="280" text-anchor="middle" font-size="11" fill="#333">IDLE -&gt; SETUP -&gt;</text>
  <text x="305" y="295" text-anchor="middle" font-size="11" fill="#333">ACCESS FSM</text>
  <text x="305" y="318" text-anchor="middle" font-size="11" fill="#333">drives PSEL, PENABLE,</text>
  <text x="305" y="333" text-anchor="middle" font-size="11" fill="#333">PADDR, PWRITE, PWDATA</text>
  <text x="305" y="350" text-anchor="middle" font-size="11" fill="#333">reads PRDATA, PREADY</text>

  <!-- APB_UART_SLAVE -->
  <rect x="450" y="230" width="200" height="160" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="550" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">APB_UART_SLAVE</text>
  <text x="550" y="280" text-anchor="middle" font-size="11" fill="#333">addr 0x0 write -&gt; wr_en,</text>
  <text x="550" y="294" text-anchor="middle" font-size="11" fill="#333">tx_data = PWDATA[7:0]</text>
  <text x="550" y="313" text-anchor="middle" font-size="11" fill="#333">addr 0x4 read -&gt; rx_data,</text>
  <text x="550" y="327" text-anchor="middle" font-size="11" fill="#333">rdy_clr pulses</text>
  <text x="550" y="346" text-anchor="middle" font-size="11" fill="#333">addr 0x8 read -&gt; {rdy,busy}</text>
  <text x="550" y="365" text-anchor="middle" font-size="11" fill="#333">(status register)</text>

  <!-- UART_TOP outer -->
  <rect x="695" y="130" width="250" height="400" rx="10" fill="#eef7ff" stroke="#0369a1" stroke-width="2"/>
  <text x="820" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#0369a1">UART_TOP</text>

  <!-- Baud_rate_gen -->
  <rect x="715" y="170" width="210" height="70" rx="6" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/>
  <text x="820" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#0369a1">Baud_rate_gen</text>
  <text x="820" y="212" text-anchor="middle" font-size="10" fill="#333">counts clks -&gt; tx_en / rx_en</text>

  <!-- UART_TX -->
  <rect x="715" y="260" width="210" height="90" rx="6" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/>
  <text x="820" y="285" text-anchor="middle" font-size="12" font-weight="bold" fill="#0369a1">UART_TX</text>
  <text x="820" y="302" text-anchor="middle" font-size="10" fill="#333">IDLE-START-DATA-STOP</text>
  <text x="820" y="317" text-anchor="middle" font-size="10" fill="#333">shifts data_in out -&gt; tx</text>
  <text x="820" y="332" text-anchor="middle" font-size="10" fill="#333">busy while sending</text>

  <!-- UART_RX -->
  <rect x="715" y="370" width="210" height="130" rx="6" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/>
  <text x="820" y="393" text-anchor="middle" font-size="12" font-weight="bold" fill="#0369a1">UART_RX</text>
  <text x="820" y="410" text-anchor="middle" font-size="10" fill="#333">16x oversample (sample</text>
  <text x="820" y="423" text-anchor="middle" font-size="10" fill="#333">counter), START-DATA-STOP</text>
  <text x="820" y="441" text-anchor="middle" font-size="10" fill="#333">shifts rx bit-by-bit into temp</text>
  <text x="820" y="456" text-anchor="middle" font-size="10" fill="#333">latches data_out, sets rdy</text>
  <text x="820" y="474" text-anchor="middle" font-size="10" fill="#333">rdy cleared by rdy_clr</text>
  <text x="820" y="489" text-anchor="middle" font-size="10" fill="#333">(from APB_UART_SLAVE)</text>

  <!-- loopback tx -> rx -->
  <path d="M925,300 C 980,300 980,430 925,430" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="950" y="368" text-anchor="middle" font-size="10" fill="#dc2626" transform="rotate(90 950 368)">tx -&gt; rx (loopback)</text>

  <!-- Arrows: driver -> APB_MASTER -->
  <path d="M150,300 L220,300" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- APB_MASTER <-> APB_UART_SLAVE -->
  <path d="M390,275 L450,275" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="268" text-anchor="middle" font-size="9" fill="#333">PSEL,PENABLE,</text>
  <text x="420" y="279" text-anchor="middle" font-size="9" fill="#333" dy="8">PADDR,PWDATA</text>
  <path d="M450,345 L390,345" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="360" text-anchor="middle" font-size="9" fill="#333">PRDATA,PREADY</text>

  <!-- APB_UART_SLAVE <-> UART_TOP -->
  <path d="M650,290 L695,290" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="672" y="283" text-anchor="middle" font-size="9" fill="#333" transform="rotate(0 672 283)">wr_en,</text>
  <text x="672" y="296" text-anchor="middle" font-size="9" fill="#333">tx_data</text>
  <path d="M695,330 L650,330" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="672" y="323" text-anchor="middle" font-size="9" fill="#333">busy,rdy,</text>
  <text x="672" y="345" text-anchor="middle" font-size="9" fill="#333">rx_data</text>
  <path d="M650,370 L695,370" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="672" y="385" text-anchor="middle" font-size="9" fill="#333">rdy_clr</text>

  <!-- rdata/rdy back to testbench -->
  <path d="M220,340 L150,340" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="185" y="325" text-anchor="middle" font-size="9" fill="#333">rdata, rdy</text>

  <!-- legend -->
  <rect x="220" y="540" width="14" height="14" fill="#eef2ff" stroke="#4338ca"/>
  <text x="240" y="551" font-size="11" fill="#333">Testbench driven</text>
  <rect x="380" y="540" width="14" height="14" fill="#fef3c7" stroke="#b45309"/>
  <text x="400" y="551" font-size="11" fill="#333">APB master (protocol FSM)</text>
  <rect x="580" y="540" width="14" height="14" fill="#dcfce7" stroke="#15803d"/>
  <text x="600" y="551" font-size="11" fill="#333">APB slave / register map</text>
  <rect x="220" y="565" width="14" height="14" fill="#eef7ff" stroke="#0369a1"/>
  <text x="240" y="576" font-size="11" fill="#333">UART core (baud, tx, rx)</text>
  <line x1="380" y1="572" x2="410" y2="572" stroke="#dc2626" stroke-width="2"/>
  <text x="418" y="576" font-size="11" fill="#333">Loopback path (tx pin -&gt; rx pin, no external cable)</text>
</svg>
